# Waybill：三个系统各用一个子域名
#
#   waybill.tycode.xyz  控制台（API + 前端）
#   oa.tycode.xyz       OA 仿真系统
#   fin.tycode.xyz      财务系统
#   tycode.xyz / www    跳转到控制台
#
# 三个服务本身都只监听 127.0.0.1，公网只能通过 nginx 进来。
# agent 访问 OA 和财务走的是 127.0.0.1，不经过 nginx，所以这两个域名挂不挂都不影响它。

server {
    listen 80;
    server_name tycode.xyz www.tycode.xyz;
    return 301 https://waybill.tycode.xyz$request_uri;
}

server {
    listen 80;
    server_name waybill.tycode.xyz;

    access_log /var/log/nginx/waybill.access.log;
    error_log  /var/log/nginx/waybill.error.log;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带哈希的静态资源，长期缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# OA：被 agent 操作的目标系统，页面是服务端渲染的老式中后台
server {
    listen 80;
    server_name oa.tycode.xyz;

    access_log /var/log/nginx/oa.access.log;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 财务：FastAPI + React，/api 和前端同源
server {
    listen 80;
    server_name fin.tycode.xyz;

    access_log /var/log/nginx/fin.access.log;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
