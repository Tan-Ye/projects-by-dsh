# Waybill 控制台反代。
#
# 只对外开控制台；OA 和财务只监听 127.0.0.1，agent 自己能访问，公网进不来。
# 如果想让面试官直接看财务系统，把文件末尾那段注释打开。

server {
    listen 80;
    server_name tycode.xyz www.tycode.xyz;

    # 只记录必要的日志，别把 cookie 写进去
    access_log /var/log/nginx/waybill.access.log;
    error_log  /var/log/nginx/waybill.error.log;

    client_max_body_size 20m;

    # 批次启动是异步的（接口立刻返回，执行在后台），但登录 + 扫描那段
    # 如果以后改成同步，需要留足时间
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带哈希的静态资源，可以长期缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

